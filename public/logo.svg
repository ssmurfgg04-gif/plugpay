<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="PlugPay logo">
  <defs>
    <linearGradient id="ppg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e557d6"/>
      <stop offset="1" stop-color="#691460"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#ppg)"/>
  <g fill="#fff">
    <!-- prongs -->
    <rect x="17.4" y="8" width="4.2" height="7.4" rx="2.1"/>
    <rect x="26.4" y="8" width="4.2" height="7.4" rx="2.1"/>
    <!-- plug body (dome down) -->
    <path d="M13 15.6h22v6.9c0 6.4-4.9 11.2-11 11.2s-11-4.8-11-11.2z"/>
  </g>
  <!-- check cut-out inside body -->
  <path d="M20.6 23.2l3.1 3.1 5.7-5.7" fill="none" stroke="url(#ppg)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cable -->
  <path d="M24 33.7v3.1c0 1.9 1.5 3.2 3.4 3.2h1.2" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
</svg>
