name: Netlify Diagnostics

# Queries the Netlify API (repo secrets; token never printed) to locate the
# site-level setting behind the /.netlify/scripts/hud injection that breaks
# React hydration (#418) on every page.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'ssmurfgg04-gif/plugpay' }}
    steps:
      - uses: actions/checkout@v4
      - name: Dump Netlify site config
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: python3 .github/scripts/netlify_dump.py
