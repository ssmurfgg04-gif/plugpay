name: Deploy to Cloudflare Workers

# Deploys the production OpenNext build to the "plugpay" Worker (plugpay.co.ke)
# on every push to main. Until CLOUDFLARE_API_TOKEN exists in the repo's
# Actions secrets this workflow exits early (same pattern as deploy-netlify.yml).
#
# One-time setup (site owner):
#   GitHub repo → Settings → Secrets and variables → Actions:
#     CLOUDFLARE_API_TOKEN = <Cloudflare API token with Workers:Edit + Assets:Edit>
#   (CLOUDFLARE_ACCOUNT_ID is public account metadata, hardcoded below.)
#   Next build secrets reuse the ones already present: NEXT_PUBLIC_SUPABASE_URL,
#   NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY, SESSION_SECRET.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'ssmurfgg04-gif/plugpay' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy credentials
        id: creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN secret not set — skipping deploy (CI still ran)."
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.ok == 'true'
        run: npm ci

      # opennextjs-cloudflare build runs `npm run build` (pinned via
      # open-next.config.ts) with the env below. NEXT_PUBLIC_SITE_URL must be
      # the live domain — the committed secret may still point at Netlify,
      # so it is overridden here.
      - name: Build and deploy to Cloudflare Workers
        if: steps.creds.outputs.ok == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://plugpay.co.ke
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 66d82edcfa565a87f57553941e87f670
        run: |
          npx opennextjs-cloudflare build
          # Plain wrangler instead of `opennextjs-cloudflare deploy`: the
          # deploy wrapper shells out to bun when it spots bun.lock, and the
          # runner has no bun. wrangler.jsonc already points at the
          # .open-next output, so this uploads the identical bundle.
          npx wrangler deploy
