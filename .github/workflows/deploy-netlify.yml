name: Deploy to Netlify

# Deploys the production build to the existing Netlify site
# (https://plugnply.netlify.app) on every push to main.
#
# One-time setup (site owner, 2 minutes):
#   1. Netlify → User settings → Applications → New access token → copy.
#   2. GitHub repo → Settings → Secrets and variables → Actions:
#        NETLIFY_AUTH_TOKEN = <the token>
#        NETLIFY_SITE_ID   = <Site information → Site ID>
#   3. Push to main (or re-run this workflow). Done — every push ships.
#
# Until those secrets exist the workflow exits early and CI (ci.yml) still
# guards every push with lint + build.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'ssmurfgg04-gif/plugpay' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy credentials
        id: creds
        run: |
          if [ -n "${{ secrets.NETLIFY_AUTH_TOKEN }}" ] && [ -n "${{ secrets.NETLIFY_SITE_ID }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID secrets not set — skipping deploy (CI still ran)."
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.ok == 'true'
        run: npm ci

      - name: Production build
        if: steps.creds.outputs.ok == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: npm run build

      - name: Deploy to Netlify
        if: steps.creds.outputs.ok == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        # --build runs the full build inside the Netlify build image so the
        # @netlify/plugin-nextjs transforms the app correctly. Build env vars
        # come from netlify.toml [build.environment] (already committed).
        run: |
          npx netlify-cli@latest deploy \
            --build \
            --prod \
            --message "Deploy $GITHUB_SHA from GitHub Actions"
